apiVersion: apps/v1
kind: Deployment
metadata:
  name: livehouse-admin
  namespace: deploy-dev
  labels:
    app: livehouse-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livehouse-admin
  template:
    metadata:
      labels:
        app: livehouse-admin
    spec:
      containers:
        - name: livehouse-admin
          image: crpi-ox7hw4m9qzeiim60.cn-hangzhou.personal.cr.aliyuncs.com/devlop8655/livehouse-admin:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: nginx-config
          configMap:
            name: livehouse-frontend-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: livehouse-admin
  namespace: deploy-dev
  labels:
    app: livehouse-admin
spec:
  type: ClusterIP
  selector:
    app: livehouse-admin
  ports:
    - name: http
      port: 80
      targetPort: 80
